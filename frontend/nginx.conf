server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: proxy /api to backend when frontend+backend share domain
  # Uncomment and set API_HOST at deploy
  # location /api/ {
  #   proxy_pass http://api:5000;
  #   proxy_set_header Host $host;
  # }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;
}
